[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.0.4

; Build with local-only values, for example:
; pio run -e esp32dev -D WIFI_SSID='"greenhouse"' -D WIFI_PASSWORD='"..."'
; Never add cloud credentials here.
build_flags =
  -D WIFI_SSID='"replace-me"'
  -D WIFI_PASSWORD='"replace-me"'
  -D PI_BASE_URL='"http://192.168.1.10:8080"'
  -D NODE_ID='"ESP32-01"'
  -D NODE_TOKEN='"replace-with-lan-token"'
