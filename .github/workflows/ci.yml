name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  edge-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r edge-agent/requirements.txt
      - run: python3 -m unittest discover -s edge-agent -p 'test_*.py'

  edge-agent-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag greenhouse-edge-test ./edge-agent
      - run: >-
          docker run --rm --entrypoint python
          --volume "$PWD/edge-agent:/tests:ro"
          greenhouse-edge-test -m unittest discover -s /tests -p 'test_*.py'
